<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="UTF-8">
<title>Laporan Medication Error</title>
<style>
  :root{
    --bg:#f4f7fa; --card:#ffffff; --border:#e1e7ee; --text:#1c2733; --muted:#6b7c8d;
    --accent:#0f7a6b; --accent-dark:#0b5c50; --accent-soft:#e6f4f1;
    --danger:#c0392b; --danger-soft:#fbeae8;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
  }
  header{
    padding:18px 20px 16px;
    background:linear-gradient(135deg,var(--accent-dark),var(--accent));
    color:#fff;
  }
  header h1{margin:0; font-size:1.25rem; font-weight:700; display:flex; align-items:center; gap:8px;}
  header p{margin:4px 0 0; font-size:.85rem; opacity:.9;}
  main{max-width:900px; margin:0 auto; padding:18px 16px 40px;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px; margin-bottom:18px;
  }
  .card h2{margin:0 0 14px; font-size:1.02rem;}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:560px){ .grid{grid-template-columns:1fr;} }
  label{display:block; font-size:.8rem; font-weight:600; color:var(--muted); margin-bottom:5px;}
  select,input,textarea{
    width:100%; padding:10px 11px; border-radius:9px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-size:.92rem; font-family:inherit;
  }
  select:focus,input:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}
  textarea{resize:vertical; min-height:80px;}
  .field{margin-bottom:12px;}
  .full{grid-column:1/-1;}
  .btn{
    appearance:none; border:none; cursor:pointer; border-radius:9px; padding:11px 18px;
    font-size:.92rem; font-weight:600; font-family:inherit;
  }
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-primary:disabled{opacity:.6; cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--muted); border:1px solid var(--border);}
  .row-end{display:flex; justify-content:flex-end; gap:10px; margin-top:4px;}
  .status{font-size:.82rem; margin-top:8px; min-height:1.2em;}
  .status.ok{color:var(--accent-dark);}
  .status.err{color:var(--danger);}
  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
  .toolbar select{width:auto; min-width:170px;}
  .count-pill{
    margin-left:auto; font-size:.78rem; color:var(--muted); background:var(--bg);
    border:1px solid var(--border); padding:5px 10px; border-radius:999px;
  }
  .entry{
    border:1px solid var(--border); border-radius:10px; padding:13px 14px; margin-bottom:10px;
    background:var(--bg);
  }
  .entry-top{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:6px;}
  .tag{
    font-size:.72rem; font-weight:700; padding:3px 9px; border-radius:999px;
    background:var(--accent-soft); color:var(--accent-dark);
  }
  .tag.danger{background:var(--danger-soft); color:var(--danger);}
  .entry-date{font-size:.78rem; color:var(--muted); margin-left:auto;}
  .entry-meta{font-size:.85rem; margin:2px 0 6px; color:var(--text);}
  .entry-meta b{font-weight:600;}
  .entry-kron{font-size:.87rem; color:var(--muted); line-height:1.45; white-space:pre-wrap;}
  .empty{text-align:center; color:var(--muted); padding:30px 10px; font-size:.9rem;}
</style>
</head>
<body>
<header>
  <h1>💊 Laporan Medication Error</h1>
  <p>RSUD Aji Muhammad Parikesit — form pelaporan untuk seluruh staf depo farmasi</p>
</header>

<main>
  <div class="card">
    <h2>Formulir Laporan Baru</h2>
    <form id="reportForm">
      <div class="grid">
        <div class="field">
          <label for="depo">Nama Depo</label>
          <select id="depo" required>
            <option value="" disabled selected>Pilih depo</option>
            <option>Depo Farmasi Rawat Jalan</option>
            <option>Depo Farmasi Rawat Inap</option>
            <option>Depo Farmasi IGD</option>
          </select>
        </div>
        <div class="field">
          <label for="jenis">Jenis Kesalahan</label>
          <select id="jenis" required>
            <option value="" disabled selected>Pilih jenis kesalahan</option>
            <option>Kesalahan Pemberian Obat</option>
            <option>Kesalahan Pelabelan Etiket</option>
          </select>
        </div>
        <div class="field">
          <label for="pasien">Nama Pasien</label>
          <input id="pasien" type="text" placeholder="Nama pasien" required>
        </div>
        <div class="field">
          <label for="petugas">Nama Petugas</label>
          <input id="petugas" type="text" placeholder="Nama petugas yang melapor" required>
        </div>
        <div class="field">
          <label for="tanggal">Tanggal Kejadian</label>
          <input id="tanggal" type="date" required>
        </div>
      </div>
      <div class="field full">
        <label for="kronologi">Kronologi</label>
        <textarea id="kronologi" placeholder="Jelaskan kronologi kejadian secara singkat dan jelas" required></textarea>
      </div>
      <div class="row-end">
        <button type="reset" class="btn btn-ghost">Bersihkan</button>
        <button type="submit" class="btn btn-primary" id="submitBtn">Kirim Laporan</button>
      </div>
      <div class="status" id="formStatus"></div>
    </form>
  </div>

  <div class="card">
    <h2>Riwayat Laporan</h2>
    <div class="toolbar">
      <select id="filterDepo">
        <option value="">Semua Depo</option>
        <option>Depo Farmasi Rawat Jalan</option>
        <option>Depo Farmasi Rawat Inap</option>
        <option>Depo Farmasi IGD</option>
      </select>
      <select id="filterJenis">
        <option value="">Semua Jenis</option>
        <option>Kesalahan Pemberian Obat</option>
        <option>Kesalahan Pelabelan Etiket</option>
      </select>
      <span class="count-pill" id="countPill">0 laporan</span>
    </div>
    <div id="list"><div class="empty">Memuat laporan…</div></div>
  </div>
</main>

<script>
  var allEntries = [];

  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function formatDate(iso){
    if(!iso) return "-";
    var d = new Date(iso + "T00:00:00");
    if(isNaN(d)) return iso;
    return d.toLocaleDateString("id-ID", {day:"2-digit", month:"long", year:"numeric"});
  }

  function render(){
    var list = document.getElementById("list");
    var fDepo = document.getElementById("filterDepo").value;
    var fJenis = document.getElementById("filterJenis").value;
    var items = allEntries.filter(function(e){
      return (!fDepo || e.depo === fDepo) && (!fJenis || e.jenis === fJenis);
    });
    items.sort(function(a,b){
      return (b.tanggal||"").localeCompare(a.tanggal||"") || (b.timestamp||"").localeCompare(a.timestamp||"");
    });

    document.getElementById("countPill").textContent = items.length + " laporan";

    if(items.length === 0){
      list.innerHTML = '<div class="empty">Belum ada laporan yang cocok dengan filter ini.</div>';
      return;
    }

    list.innerHTML = items.map(function(e){
      var isEtiket = e.jenis === "Kesalahan Pelabelan Etiket";
      return '' +
        '<div class="entry">' +
          '<div class="entry-top">' +
            '<span class="tag">' + escapeHtml(e.depo) + '</span>' +
            '<span class="tag ' + (isEtiket ? '' : 'danger') + '">' + escapeHtml(e.jenis) + '</span>' +
            '<span class="entry-date">' + formatDate(e.tanggal) + '</span>' +
          '</div>' +
          '<div class="entry-meta"><b>Pasien:</b> ' + escapeHtml(e.pasien) + ' &nbsp;·&nbsp; <b>Petugas:</b> ' + escapeHtml(e.petugas) + '</div>' +
          '<div class="entry-kron">' + escapeHtml(e.kronologi) + '</div>' +
        '</div>';
    }).join("");
  }

  function loadReports(){
    google.script.run
      .withSuccessHandler(function(reports){
        allEntries = reports || [];
        render();
      })
      .withFailureHandler(function(err){
        document.getElementById("list").innerHTML =
          '<div class="empty">Gagal memuat laporan: ' + escapeHtml(err.message || String(err)) + '</div>';
      })
      .getReports();
  }

  document.getElementById("filterDepo").addEventListener("change", render);
  document.getElementById("filterJenis").addEventListener("change", render);

  document.getElementById("reportForm").addEventListener("submit", function(e){
    e.preventDefault();
    var statusEl = document.getElementById("formStatus");
    var btn = document.getElementById("submitBtn");
    var data = {
      depo: document.getElementById("depo").value,
      jenis: document.getElementById("jenis").value,
      pasien: document.getElementById("pasien").value.trim(),
      petugas: document.getElementById("petugas").value.trim(),
      tanggal: document.getElementById("tanggal").value,
      kronologi: document.getElementById("kronologi").value.trim()
    };
    if(!data.depo || !data.jenis || !data.pasien || !data.petugas || !data.tanggal || !data.kronologi){
      statusEl.textContent = "Mohon lengkapi semua kolom.";
      statusEl.className = "status err";
      return;
    }
    btn.disabled = true;
    statusEl.textContent = "Mengirim…";
    statusEl.className = "status";

    google.script.run
      .withSuccessHandler(function(){
        statusEl.textContent = "Laporan berhasil dikirim.";
        statusEl.className = "status ok";
        document.getElementById("reportForm").reset();
        btn.disabled = false;
        loadReports();
      })
      .withFailureHandler(function(err){
        statusEl.textContent = "Gagal mengirim laporan: " + (err.message || String(err));
        statusEl.className = "status err";
        btn.disabled = false;
      })
      .submitReport(data);
  });

  loadReports();
</script>
</body>
</html>
